name: mdlxe
description: "Aplicativo Mapa de Coleta Sustentável para Teresina."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.0
  flutter_overpass: ^1.2.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  geolocator: ^14.0.3
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/recicla-teresina-logo.png"
  min_sdk_android: 23